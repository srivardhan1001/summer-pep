{% macro render_weather_card(card) %}
<div class="col-md-6 col-lg-4 mb-4">
  <div class="card glass-card h-100 weather-card-hover border-0 shadow-sm">
    <div class="card-body p-4 position-relative overflow-hidden">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h4 class="fw-bold mb-0">{{ card.city }}</h4>
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2 py-1 small">{{ card.country }}</span>
        </div>
        <img src="https://openweathermap.org/img/wn/{{ card.icon }}@2x.png" alt="{{ card.description }}" class="weather-icon-lg" width="60" height="60">
      </div>
      
      <div class="d-flex align-items-baseline gap-2 mb-3">
        <span class="display-5 fw-extrabold text-body">{{ card.temp }}°</span>
        <span class="text-muted fs-6">{{ card.description }}</span>
      </div>

      <div class="row g-2 pt-3 border-top border-secondary-subtle small text-muted">
        <div class="col-6"><i class="fa-solid fa-temperature-half me-1"></i> Feels like: {{ card.feels_like }}°C</div>
        <div class="col-6"><i class="fa-solid fa-droplet me-1"></i> Humidity: {{ card.humidity }}%</div>
        <div class="col-6"><i class="fa-solid fa-wind me-1"></i> Wind: {{ card.wind_speed }} km/h</div>
        <div class="col-6"><i class="fa-solid fa-gauge-high me-1"></i> Pressure: {{ card.pressure }} hPa</div>
      </div>

      <div class="mt-3 text-end">
        <a href="{{ url_for('weather.dashboard', city=card.city) }}" class="btn btn-sm btn-outline-primary rounded-pill px-3">View Full Dashboard <i class="fa-solid fa-arrow-right ms-1"></i></a>
      </div>
    </div>
  </div>
</div>
{% endmacro %}
