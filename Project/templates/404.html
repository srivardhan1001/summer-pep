{% extends 'base.html' %}

{% block title %}404 Page Not Found — WeatherSphere{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-extrabold text-gradient mb-2">404</div>
    <div class="error-illustration mb-4">
      <i class="fa-solid fa-cloud-bolt display-2 text-warning animate-bounce"></i>
    </div>
    <h2 class="fw-bold mb-3">Lost in the Storm? Page Not Found</h2>
    <p class="text-muted lead mb-4 max-w-lg mx-auto">The weather page or city query you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('weather.home') }}" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm">
      <i class="fa-solid fa-house me-2"></i> Return to Safety (Home)
    </a>
  </div>
</div>
{% endblock %}
